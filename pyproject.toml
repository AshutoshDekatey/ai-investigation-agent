[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investigation-agent"
version = "0.1.0"
description = "Read-only, evidence-based synthetic payment investigations"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2.10,<3", "numpy>=2,<3", "openai>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
investigate = "investigation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investigation = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
